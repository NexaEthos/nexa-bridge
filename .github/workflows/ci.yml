name: CI
# Wiki: docs/wiki/development.md

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLIPPY_ARGS: >-
    -D warnings -W clippy::pedantic -W clippy::nursery -W clippy::cargo
    -W clippy::unwrap_used -W clippy::expect_used -W clippy::panic
    -W clippy::todo -W clippy::unimplemented -W clippy::dbg_macro
    -W clippy::print_stdout -W clippy::print_stderr

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --exclude nexa-desktop --all-targets --all-features --locked
      - run: |
          read -ra clippy_args <<< "$CLIPPY_ARGS"
          cargo clippy --workspace --exclude nexa-desktop --all-targets --all-features --locked -- "${clippy_args[@]}"
      - run: cargo test --workspace --exclude nexa-desktop --all-targets --all-features --locked
      - run: cargo build --release --workspace --exclude nexa-desktop --locked

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libglib2.0-dev libgtk-3-dev
      - name: Stage sidecars
        run: ./crates/desktop/sync-sidecars.sh
      - run: cargo check -p nexa-desktop --all-targets --all-features --locked
      - run: |
          read -ra clippy_args <<< "$CLIPPY_ARGS"
          cargo clippy -p nexa-desktop --all-targets --all-features --locked -- "${clippy_args[@]}"
      - run: cargo test -p nexa-desktop --all-targets --all-features --locked
      - run: node --check crates/desktop/ui/app.js

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libglib2.0-dev libgtk-3-dev
      - name: Stage sidecars
        run: ./crates/desktop/sync-sidecars.sh
      - run: cargo check --workspace --all-targets --all-features --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify GLib backport
        run: python3 .github/scripts/verify_glib_backport.py
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
          command-arguments: -D warnings

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          scan_dir="$(mktemp -d)"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "$release/$archive" -o "$scan_dir/$archive"
          curl -sSfL "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$scan_dir/checksums.txt"
          (cd "$scan_dir" && awk -v archive="$archive" '$2 == archive' checksums.txt | sha256sum --check --strict)
          sudo tar -xz -C /usr/local/bin -f "$scan_dir/$archive" gitleaks
          gitleaks version
      - name: Scan fetched Git history
        run: gitleaks git . --log-opts=--all --redact --no-banner
      - name: Scan the working tree
        run: gitleaks dir . --redact --verbose --no-banner
