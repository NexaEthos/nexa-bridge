name: Release candidate
# Wiki: docs/wiki/release.md

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag sits on main, names the workspace version and has its changelog section
        id: read
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::${GITHUB_REF_NAME} is not on main"; exit 1; }
          declared=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "nexa-desktop") | .version')
          [ "$declared" = "$version" ] \
            || { echo "::error::the tag says ${version}, the workspace says ${declared}"; exit 1; }
          grep -q "^## \[${version}\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no section for ${version}"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: tag
    uses: ./.github/workflows/native.yml
    permissions:
      contents: read

  candidate:
    name: candidate
    needs: [tag, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SBOM of the source at the tag
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/nexa-bridge-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{cli,desktop}-*"
          path: candidate
      - name: The candidate — every supported target, the SBOM, the record, one checksum list
        run: |
          set -euo pipefail
          # Compiled only, not a supported platform: it stays a matrix artifact and never a release file
          rm -r candidate/cli-aarch64-pc-windows-msvc
          mv "${RUNNER_TEMP}/nexa-bridge-${VERSION}.spdx.json" candidate/
          cd candidate
          find . -type f -name SHA256SUMS -delete   # the per-job lists give way to the one below
          jq -n --arg tag "$GITHUB_REF_NAME" --arg version "$VERSION" --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg workflow "$GITHUB_WORKFLOW_REF" \
            --arg sbom "nexa-bridge-${VERSION}.spdx.json" \
            '{tag: $tag, version: $version, commit: $commit, run_id: ($run | tonumber),
              run_attempt: ($attempt | tonumber), workflow: $workflow, sbom: $sbom}' > candidate.json
          find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "${RUNNER_TEMP}/sums"
          mv "${RUNNER_TEMP}/sums" SHA256SUMS
          { echo "### Candidate ${GITHUB_REF_NAME}"; echo; echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Attest the provenance of every file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: candidate/**/*
      - name: Attest the SBOM to every binary
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            candidate/cli-*/nexa-llm-*
            candidate/desktop-*/*
            candidate/desktop-*/bin/*
          sbom-path: candidate/nexa-bridge-${{ env.VERSION }}.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.ref_name }}
          path: candidate
          retention-days: 90
          if-no-files-found: error
