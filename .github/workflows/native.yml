name: Native
# Wiki: docs/wiki/development.md#native-matrix

on:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/native.yml"]
  pull_request:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/native.yml"]
  workflow_dispatch:
  # The release candidate calls this workflow: one build, never a second one.
  workflow_call:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Official builds point at Agora; a custom build sets its own origin or none. See docs/wiki/desktop.md
  NEXA_AGORA_URL: https://agora.nexaethos.com
  # The channel a build declares about itself: official only from a release tag. See docs/wiki/release-review.md#build-diagnostics
  NEXA_BUILD_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'official' || 'custom' }}
  CLIPPY_ARGS: >-
    -D warnings -W clippy::pedantic -W clippy::nursery -W clippy::cargo
    -W clippy::unwrap_used -W clippy::expect_used -W clippy::panic
    -W clippy::todo -W clippy::unimplemented -W clippy::dbg_macro
    -W clippy::print_stdout -W clippy::print_stderr

jobs:
  cli:
    name: cli (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          # Compiled only: the x64 runner cannot run ARM64 tests. A build is not a supported platform.
          - { os: windows-2025, target: aarch64-pc-windows-msvc, build_only: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install the musl linker
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Clippy (strict)
        run: |
          read -ra clippy_args <<< "$CLIPPY_ARGS"
          cargo clippy --workspace --exclude nexa-desktop --all-targets --all-features --locked --target ${{ matrix.target }} -- "${clippy_args[@]}"
        shell: bash
      - name: Test
        if: ${{ !matrix.build_only }}
        run: cargo test --workspace --exclude nexa-desktop --all-targets --all-features --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p nexa-llm-bridge -p nexa-llm-connector
      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          out="dist/cli-${{ matrix.target }}"
          mkdir -p "$out"
          ext=""
          case "${{ matrix.target }}" in *-windows-*) ext=".exe" ;; esac
          for bin in nexa-llm-bridge nexa-llm-connector; do
            cp "target/${{ matrix.target }}/release/$bin$ext" "$out/"
          done
          cd "$out"
          if command -v sha256sum >/dev/null; then sha256sum -- * > SHA256SUMS; else shasum -a 256 -- * > SHA256SUMS; fi
          { echo '### cli ${{ matrix.target }}'; echo; echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/cli-${{ matrix.target }}
          if-no-files-found: error

  desktop:
    name: desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, bundles: "deb appimage" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, bundles: "deb appimage" }
          - { os: macos-15, target: aarch64-apple-darwin, bundles: "app dmg" }
          - { os: macos-15, target: x86_64-apple-darwin, bundles: "app dmg" }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, bundles: "nsis msi" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-${{ matrix.target }}
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libglib2.0-dev libgtk-3-dev patchelf
      - name: Stage sidecars
        shell: bash
        run: ./crates/desktop/sync-sidecars.sh ${{ matrix.target }}
      - name: Clippy (strict)
        shell: bash
        run: |
          read -ra clippy_args <<< "$CLIPPY_ARGS"
          cargo clippy -p nexa-desktop --all-targets --all-features --locked --target ${{ matrix.target }} -- "${clippy_args[@]}"
      - name: Test
        run: cargo test -p nexa-desktop --all-targets --all-features --locked --target ${{ matrix.target }}
      - name: Bundle (unsigned)
        shell: bash
        working-directory: crates/desktop
        env:
          CI: "true"
        run: npx --yes @tauri-apps/cli@2.12.1 build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          out="dist/desktop-${{ matrix.target }}"
          mkdir -p "$out"
          bundle="target/${{ matrix.target }}/release/bundle"
          find "$bundle" -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' \) -exec cp {} "$out/" \;
          if [ -d "$bundle/macos" ]; then (cd "$bundle/macos" && for app in *.app; do tar -czf "$OLDPWD/$out/${app%.app}-${{ matrix.target }}.app.tar.gz" "$app"; done); fi
          ext=""
          case "${{ matrix.target }}" in *-windows-*) ext=".exe" ;; esac
          # The compiled bytes beside the bundle: the release signs them and re-wraps, never recompiles
          mkdir -p "$out/bin"
          cp "target/${{ matrix.target }}/release/nexa-desktop$ext" "$out/bin/"
          for bin in nexa-llm-bridge nexa-llm-connector; do
            cp "crates/desktop/binaries/$bin-${{ matrix.target }}$ext" "$out/bin/"
          done
          cd "$out"
          # Bundle names carry spaces ("Nexa Bridge_0.1.0_x64.dmg"): the list is null-terminated end to end
          if command -v sha256sum >/dev/null; then find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "${RUNNER_TEMP}/sums"; else find . -type f -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256 > "${RUNNER_TEMP}/sums"; fi
          mv "${RUNNER_TEMP}/sums" SHA256SUMS
          { echo '### desktop ${{ matrix.target }}'; echo; echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: dist/desktop-${{ matrix.target }}
          if-no-files-found: error
