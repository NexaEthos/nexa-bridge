version: 2
updates:
  # Cargo: keep the workspace on the latest published versions. Patch/minor bumps are grouped into
  # one PR to keep the noise down; a major bump gets its own PR because it needs a real review.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      patch-and-minor:
        update-types:
          - minor
          - patch

  # The workflows pin actions to commit SHAs; Dependabot moves the pin and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
