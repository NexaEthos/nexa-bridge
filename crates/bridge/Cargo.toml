[package]
name = "nexa-llm-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Local OpenAI-compatible streaming reverse proxy + auth, in front of a self-hosted vLLM."
license.workspace = true
publish = false

[[bin]]
name = "nexa-llm-bridge"
path = "src/main.rs"

[dependencies]
nexa-tunnel-protocol = { path = "../protocol" }
# io-std + io-util: under a supervisor, stdin's end is the stop signal. See docs/wiki/desktop.md#sidecar-lifecycle
tokio = { workspace = true, features = ["io-std", "io-util"] }
axum.workspace = true
tower-http.workspace = true
reqwest.workspace = true
rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
figment.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
sha2.workspace = true
subtle.workspace = true
governor.workspace = true
futures-util.workspace = true

[build-dependencies]
nexa-build-info = { path = "../build-info" }
