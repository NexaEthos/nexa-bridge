[package]
name = "nexa-llm-connector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Box-side connector: dials out to the relay over WSS and forwards tunneled requests to the local bridge."
license.workspace = true
publish = false

[[bin]]
name = "nexa-llm-connector"
path = "src/main.rs"

[dependencies]
nexa-tunnel-protocol = { path = "../protocol" }
# io-std + io-util: under a supervisor, stdin's end is the stop signal. See docs/wiki/desktop.md#sidecar-lifecycle
tokio = { workspace = true, features = ["io-std", "io-util"] }
tokio-tungstenite.workspace = true
reqwest.workspace = true
rustls.workspace = true
futures-util.workspace = true
bytes.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
figment.workspace = true
serde.workspace = true
anyhow.workspace = true
qrcode = { version = "0.14.1", default-features = false }
nexa-link = { version = "1.0.1", path = "../link" }
serde_json.workspace = true

[build-dependencies]
nexa-build-info = { path = "../build-info" }
